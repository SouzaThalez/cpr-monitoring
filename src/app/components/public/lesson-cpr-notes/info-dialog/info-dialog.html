<h2 mat-dialog-title class="print-title">Informações da Aula</h2>

<mat-dialog-content class="mat-typography print-text">
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Professor</mat-label>
      <input matInput formControlName="professor" placeholder="Digite o nome do professor" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Aula</mat-label>
      <input matInput formControlName="lesson" placeholder="Digite o nome da aula" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="form-footer print-btns">
  <div class="button cancel-button" (click)="onClose(false)">Cancelar</div>
  <div class="button save-button" [class.disabled]="form.invalid" (click)="onClose(true)">
    Salvar
  </div>
</mat-dialog-actions>
